# 마이스타크래프트 MySQL (오라클 서버용)
# 사용: cd deploy && docker compose --env-file ../.env up -d
# 외부에 노출하지 않도록 127.0.0.1에만 바인딩한다.
services:
  mysql:
    image: mysql:8.0
    container_name: mystarcraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mystarcraft}
      MYSQL_USER: ${MYSQL_USER:-mystarcraft}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD를 .env에 설정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정하세요}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # 작은 서버(1GB 메모리)용 메모리 절약 설정
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=30
      - --key-buffer-size=8M
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mystarcraft-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mystarcraft-mysql-data:
