name: Server diagnose
on: workflow_dispatch
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze careers (read-only)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 15 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/k -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" \
            "sudo docker exec mystarcraft-mysql sh -c 'mysql -uroot -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 --max-allowed-packet=512M --raw -N -B mystarcraft -e \"SELECT c.userId,u.role,c.createdAt,c.updatedAt,c.state FROM careers c JOIN users u ON u.id=c.userId\" 2>/dev/null' | gzip -c" > /tmp/careers.tsv.gz
          ls -l /tmp/careers.tsv.gz
          gunzip -c /tmp/careers.tsv.gz | node tools/analyze-careers.mjs
