name: Server diagnose
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge binlogs over SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 15 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/k -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE' 2>&1 || true
          echo "== 전 =="; df -h / | tail -1
          sudo docker exec mystarcraft-mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW BINARY LOGS" 2>/dev/null | tail -3'
          sudo docker exec mystarcraft-mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "PURGE BINARY LOGS BEFORE NOW(); SET PERSIST binlog_expire_logs_seconds=86400;" 2>&1 | grep -v Warning'
          echo "== 후 =="; df -h / | tail -1
          sudo find /var/lib/docker/volumes/deploy_mystarcraft-mysql-data/_data -name 'binlog.*' | wc -l
          echo "== 앱 =="; pm2 restart mystarcraft >/dev/null 2>&1; sleep 5; curl -s -m 8 localhost:3100/api/health; echo
          sudo docker ps -a --format '{{.Names}} {{.Status}}'
          REMOTE
