name: Server diagnose
on: workflow_dispatch
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze rookies (read-only)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 15 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          q() { ssh -i ~/.ssh/k -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" "sudo docker exec mystarcraft-mysql sh -c 'mysql -uroot -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 --max-allowed-packet=512M --raw -N -B mystarcraft -e \"$1\" 2>/dev/null' | gzip -c"; }
          q "SELECT r.userId,u.role,r.createdAt,r.updatedAt,r.state FROM rookie_careers r JOIN users u ON u.id=r.userId" > /tmp/r.tsv.gz
          ls -l /tmp/r.tsv.gz
          gunzip -c /tmp/r.tsv.gz | node tools/analyze-rookies.mjs
          echo "== 최근 3일 요청 폭주 기록 (userId, 횟수, 시각)"
          q "SELECT userId,amount,createdAt FROM audit_logs WHERE kind='burst' AND createdAt > NOW() - INTERVAL 3 DAY ORDER BY createdAt" | gunzip -c
