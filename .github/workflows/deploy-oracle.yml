name: Deploy to Oracle

# main 에 푸시되면 오라클 서버에 자동 배포 (수동 실행도 가능)
# 필요한 저장소 Secrets:
#   ORACLE_HOST     오라클 서버 공인 IP
#   ORACLE_SSH_KEY  서버 접속용 SSH 개인키 전체 내용 (-----BEGIN ... 부터 END 까지)
#   ORACLE_USER     (선택) 접속 사용자, 기본 ubuntu
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "배포할 브랜치"
        default: "main"

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "::warning::ORACLE_HOST / ORACLE_SSH_KEY Secrets 가 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: |
          mkdir -p ~/.ssh
          # 윈도우 줄바꿈(CRLF)·앞뒤 공백 제거 후 마지막 줄바꿈 보장
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          # 키 형식 진단 (비밀 내용은 출력하지 않고 첫 줄 머리글과 줄 수만 표시)
          echo "키 첫 줄: $(head -n1 ~/.ssh/oracle_key | grep -oE '^(-----BEGIN [A-Z ]+-----|PuTTY-User-Key-File-[0-9]+|ssh-[a-z0-9]+|ecdsa-[a-z0-9-]+)' || echo '알 수 없는 형식')"
          echo "키 줄 수: $(wc -l < ~/.ssh/oracle_key)"
          if ! ssh-keygen -y -f ~/.ssh/oracle_key > /dev/null 2>&1; then
            echo "::error::ORACLE_SSH_KEY 를 개인키로 읽을 수 없습니다. -----BEGIN ... PRIVATE KEY----- 부터 -----END ... PRIVATE KEY----- 까지 전체를 등록했는지 확인하세요 (.pub 공개키, PuTTY .ppk 는 사용 불가)."
            exit 1
          fi
          # 키 지문 (비밀 아님) - 서버 ~/.ssh/authorized_keys 에 있는 키와 비교용
          echo "키 지문: $(ssh-keygen -l -f ~/.ssh/oracle_key | awk '{print $2, $NF}')"
          ssh-keyscan -T 15 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "⚠ 서버 호스트키 조회 실패 (주소/22포트 확인)"
          # 접속 가능한 계정 찾기 (지정 계정 → ubuntu → opc)
          LOGIN_USER=""
          for u in "$ORACLE_USER" ubuntu opc; do
            if ssh -i ~/.ssh/oracle_key -o BatchMode=yes -o ConnectTimeout=15 "$u@$ORACLE_HOST" true 2>/dev/null; then
              LOGIN_USER="$u"; break
            fi
            echo "✗ $u 계정으로 접속 거절됨"
          done
          if [ -z "$LOGIN_USER" ]; then
            echo "::error::서버가 이 키를 거절했습니다. ORACLE_HOST 가 이 키로 접속하는 서버 주소인지, 키가 그 서버용인지 확인하세요."
            exit 1
          fi
          echo "✓ $LOGIN_USER 계정으로 접속 성공"
          ssh -i ~/.ssh/oracle_key -o ServerAliveInterval=30 "$LOGIN_USER@$ORACLE_HOST" \
            "BRANCH='$BRANCH' DOMAIN='mystarcraft.duckdns.org' bash -s" < deploy/remote-deploy.sh

      - name: Health check
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://mystarcraft.duckdns.org/api/health; then echo; echo "✅ https OK"; exit 0; fi
            sleep 10
          done
          echo "::warning::https://mystarcraft.duckdns.org 헬스체크 실패 (DuckDNS IP 또는 인증서 확인 필요)"
