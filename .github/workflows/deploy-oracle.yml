name: Deploy to Oracle

# main 에 푸시되면 오라클 서버에 자동 배포 (수동 실행도 가능)
# 필요한 저장소 Secrets:
#   ORACLE_HOST     오라클 서버 공인 IP
#   ORACLE_SSH_KEY  서버 접속용 SSH 개인키 전체 내용 (-----BEGIN ... 부터 END 까지)
#   ORACLE_USER     (선택) 접속 사용자, 기본 ubuntu
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "배포할 브랜치"
        default: "main"

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "::warning::ORACLE_HOST / ORACLE_SSH_KEY Secrets 가 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -T 15 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/oracle_key -o ServerAliveInterval=30 "$ORACLE_USER@$ORACLE_HOST" \
            "BRANCH='$BRANCH' DOMAIN='mystarcraft.duckdns.org' bash -s" < deploy/remote-deploy.sh

      - name: Health check
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://mystarcraft.duckdns.org/api/health; then echo; echo "✅ https OK"; exit 0; fi
            sleep 10
          done
          echo "::warning::https://mystarcraft.duckdns.org 헬스체크 실패 (DuckDNS IP 또는 인증서 확인 필요)"
